name: test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, to catch upstream drift: bin/list-all reads IoLanguage/io tags
    # live, and the install flow depends on their build system, so a periodic
    # run flags a broken new release before a user hits it.
    - cron: "17 9 * * 1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save
      - run: npm run lint:shell

  # Unit + hermetic regression: fast, offline, no toolchain (git/cmake/make/io
  # are stubbed). This is the required gate on every push/PR.
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save bats@1.11.0
      - run: ./node_modules/.bin/bats test/unit test/regression

  # Real end-to-end build via mise, gated behind ASDF_IO_RUN_INTEGRATION=1.
  # Only on demand / weekly: Io builds are heavy and old versions can break
  # against a moving toolchain, so this is a drift check, not a PR gate.
  integration:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: test
    env:
      ASDF_IO_RUN_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - name: Install mise
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
      - name: Install bats
        run: npm install --no-save bats@1.11.0
      - name: Integration tests
        run: ./node_modules/.bin/bats test/integration
        timeout-minutes: 20
