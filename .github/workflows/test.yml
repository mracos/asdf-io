name: test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, to catch upstream drift: bin/list-all reads IoLanguage/io tags
    # live, and the install flow depends on their build system, so a periodic
    # run flags a broken new release before a user hits it.
    - cron: "17 9 * * 1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save
      - run: npm run lint:shell

  # Unit + hermetic regression: fast, offline, no toolchain (git/cmake/make/io
  # are stubbed). This is the required gate on every push/PR.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # macOS ships bash 3.2, which bin/install is written against (no
        # mapfile, no associative arrays), so it gets its own leg.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: bash version
        run: bash --version | head -1
      - run: npm install --no-save bats@1.11.0
      - run: ./node_modules/.bin/bats test/unit test/regression

  # Real end-to-end build via mise. ASDF_IO_RUN_INTEGRATION keeps the suite
  # inert outside CI; here it always runs, because upstream is dormant and the
  # breakage comes from the toolchain moving under a decade-old source tree.
  # The weekly cron covers the stretches where nobody pushes.
  integration:
    name: integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # The macOS leg is where lib/cmake.bash earns its keep: CMP0042 for the
        # dylib install names, and the x86_64 cross-compile on arm64 hosts.
        # Neither branch runs on Linux.
        os: [ubuntu-latest, macos-latest]
    env:
      ASDF_IO_RUN_INTEGRATION: "1"
      # bin/list-all reads api.github.com, which allows 60 requests/hour per IP
      # unauthenticated; the shared macOS runner pool exhausts that. github.token
      # has read access to public repos, which is all list-all needs.
      OAUTH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install build deps (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - name: Install build deps (macos)
        if: runner.os == 'macOS'
        run: brew install cmake
      # io_cmake_flags cross-compiles to x86_64 on arm64 hosts, following
      # upstream's macOS build instructions, so running the result needs
      # Rosetta. oahd is its daemon: present means Rosetta is already there.
      - name: Ensure Rosetta
        if: runner.os == 'macOS'
        run: pgrep -q oahd || softwareupdate --install-rosetta --agree-to-license
      - name: Install mise
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
      - name: Install bats
        run: npm install --no-save bats@1.11.0
      - name: Integration tests
        run: ./node_modules/.bin/bats test/integration
        timeout-minutes: 30
